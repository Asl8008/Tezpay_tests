[pytest]
minversion = 7.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -v
    --tb=short
    --alluredir=allure-results

markers =
    smoke: Smoke tests
    regression: Regression tests
    login: Login related tests
    payment: Payment tests
    transfer: Transfer tests
    history: History tests
